# Configuração do Supabase local (CLI). Homologação e produção são projetos separados,
# configurados pelo painel/CLI conforme docs/setup.md — nunca reutilizar tabelas de outro produto.
project_id = "dono-da-vez"

[api]
enabled = true
port = 54321
# Schemas do jogo NÃO são expostos pela Data API.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.assets]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/webp", "image/svg+xml", "application/json"]
objects_path = "../assets/public"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["donodavez://auth-callback", "donodavez-staging://auth-callback", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# A verificação do JWT é feita no código (JWKS ou HS256 local) para manter /v1/health
# público, mensagens de erro de domínio consistentes e checagem de aal2 no admin.
[functions.api]
verify_jwt = false

[functions.admin]
verify_jwt = false

[functions.outbox-worker]
verify_jwt = false
